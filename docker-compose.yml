version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: discord_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: discord_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discord_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build: .
    container_name: discord_bot_migration
    command: alembic upgrade head
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/discord_bot
      - ALEMBIC_DATABASE_URL=postgresql://postgres:password@postgres:5432/discord_bot
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build: .
    container_name: discord_bot_app
    restart: always
    command: python -m bot.main
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/discord_bot
      - ALEMBIC_DATABASE_URL=postgresql://postgres:password@postgres:5432/discord_bot
    depends_on:
      migration:
        condition: service_completed_successfully

  web:
    build: .
    container_name: discord_bot_web
    restart: always
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/discord_bot
      - ALEMBIC_DATABASE_URL=postgresql://postgres:password@postgres:5432/discord_bot
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  postgres_data:
