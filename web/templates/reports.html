<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mod Panel — Жалобы</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-layout">
  {% include "partials/sidebar.html" %}
  <div class="main-content">
    <header class="top-header">
      <h1 class="page-title">📋 Жалобы (Репорты)</h1>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" onclick="loadReports()">🔄 Обновить</button>
      </div>
    </header>

    <div class="page-body">
      <!-- Фильтры -->
      <div class="card" style="margin-bottom: 20px;">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <div style="width:200px">
            <select id="filter-status" class="form-select" onchange="loadReports(1)">
              <option value="">Все статусы</option>
              <option value="open">🟡 Открыта</option>
              <option value="accepted">🟢 В работе</option>
              <option value="rejected">🔴 Отклонена</option>
              <option value="closed">⚫ Закрыта</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="loadReports(1)">Применить</button>
        </div>
      </div>

      <!-- Таблица -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Список тикетов и жалоб</span>
          <span id="total-count" style="font-size:13px;color:var(--text-secondary)"></span>
        </div>
        <div id="table-container" style="overflow-x:auto;">
          <div class="loading-overlay"><div class="spinner"></div></div>
        </div>
        <div id="pagination" class="pagination" style="margin-top:16px;display:flex;justify-content:center;gap:6px"></div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/utils.js"></script>
<script>
let currentPage = 1;

async function loadReports(page = 1) {
  currentPage = page;
  const container = document.getElementById('table-container');
  container.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';

  const statusFilter = document.getElementById('filter-status').value;
  let query = `?page=${page}&per_page=15`;
  if (statusFilter) query += `&status_filter=${statusFilter}`;

  try {
    const data = await api.get(`/reports${query}`);
    document.getElementById('total-count').textContent = `Всего: ${data.total}`;

    if (!data.items.length) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Жалоб нет</div></div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>№</th>
            <th>Истец</th>
            <th>Ответчик</th>
            <th>Суть жалобы</th>
            <th>Доказательства</th>
            <th>Статус</th>
            <th>Модератор</th>
            <th>Вердикт</th>
            <th>Создано</th>
          </tr>
        </thead>
        <tbody>
          ${data.items.map(r => `
            <tr>
              <td><b>#${r.id}</b></td>
              <td style="font-family:monospace;font-size:12px">${r.plaintiff_id}</td>
              <td style="font-family:monospace;font-size:12px"><b>${r.defendant_id}</b></td>
              <td style="max-width:260px;word-break:break-word;">${escapeHtml(r.text)}</td>
              <td style="max-width:180px;word-break:break-all;font-size:12px">
                ${r.evidence ? (r.evidence.startsWith('http') ? `<a href="${r.evidence}" target="_blank" style="color:var(--accent-light)">Ссылка ↗</a>` : escapeHtml(r.evidence)) : '—'}
              </td>
              <td><span class="badge badge-${r.status}">${reportStatusLabels[r.status] || r.status}</span></td>
              <td style="font-family:monospace;font-size:12px;color:var(--text-secondary)">${r.accepted_by || '—'}</td>
              <td style="font-size:12px;">
                ${r.verdict ? `<b>${r.verdict}</b>` : '—'}
                ${r.verdict_comment ? `<div style="font-size:11px;color:var(--text-muted)">${escapeHtml(r.verdict_comment)}</div>` : ''}
              </td>
              <td style="font-size:12px;color:var(--text-secondary)">${formatDate(r.created_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;

    renderPagination(document.getElementById('pagination'), data.page, data.total, data.per_page, loadReports);
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">${err.message}</div></div>`;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

loadReports(1);
</script>
</body>
</html>
